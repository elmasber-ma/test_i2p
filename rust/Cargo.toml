[package]
name = "rust_lib_pr_app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge = "=2.12.0"
tokio = { version = "1.44.1", features = ["full"] }
# --- I2P embebido (emissary: router Rust puro, LICENCIA MIT) ---
emissary-core = "=0.4.0"
emissary-util = { version = "=0.4.0", default-features = false, features = ["rustls"] }
reqwest = { version = "0.11", default-features = false, features = ["rustls-tls"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
